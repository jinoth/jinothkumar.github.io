                          onChange={(e) => handleInputChange('name', e.target.value)}
                          aria-invalid={Boolean(fieldErrors.name)}
                          aria-describedby={fieldErrors.name ? 'name-error' : undefined}
                          className={`w-full rounded-lg border bg-white/[0.02] px-4 py-3 text-sm text-fg placeholder-faint transition-colors focus:outline-none focus:ring-2 focus:ring-accent/25 ${fieldErrors.name ? 'border-red-500/60 focus:border-red-500/80' : 'border-white/12 focus:border-accent/60'}`}
                          placeholder={language === 'ja' ? 'お名前' : 'Your full name'}
                        />
                        {fieldErrors.name && (<p id="name-error" className="mt-2 text-xs text-red-300" role="alert">{fieldErrors.name}</p>)}
                      </div>

                      <div>
                        <label className="mb-2 block text-sm font-medium text-fg">{t.contact.company} <span className="text-accent">{t.contact.required}</span></label>
                        <input
                          type="text"
                          required
                          value={contactForm.company}
                          onChange={(e) => handleInputChange('company', e.target.value)}
                          aria-invalid={Boolean(fieldErrors.company)}
                          aria-describedby={fieldErrors.company ? 'company-error' : undefined}
                          className={`w-full rounded-lg border bg-white/[0.02] px-4 py-3 text-sm text-fg placeholder-faint transition-colors focus:outline-none focus:ring-2 focus:ring-accent/25 ${fieldErrors.company ? 'border-red-500/60 focus:border-red-500/80' : 'border-white/12 focus:border-accent/60'}`}
                          placeholder={language === 'ja' ? '会社名' : 'Your company name'}
                        />
                        {fieldErrors.company && (<p id="company-error" className="mt-2 text-xs text-red-300" role="alert">{fieldErrors.company}</p>)}
                      </div>

                      <div>
                        <label className="mb-2 block text-sm font-medium text-fg">{t.contact.website} <span className="text-accent">{t.contact.required}</span></label>
                        <input
                          type="url"
                          required
                          value={contactForm.website}
                          onChange={(e) => handleInputChange('website', e.target.value)}
                          aria-invalid={Boolean(fieldErrors.website)}
                          aria-describedby={fieldErrors.website ? 'website-error' : undefined}
                          className={`w-full rounded-lg border bg-white/[0.02] px-4 py-3 text-sm text-fg placeholder-faint transition-colors focus:outline-none focus:ring-2 focus:ring-accent/25 ${fieldErrors.website ? 'border-red-500/60 focus:border-red-500/80' : 'border-white/12 focus:border-accent/60'}`}
                          placeholder="https://www.example.com"
                        />
                        {fieldErrors.website && (<p id="website-error" className="mt-2 text-xs text-red-300" role="alert">{fieldErrors.website}</p>)}
                      </div>

                      <div>
                        <label className="mb-2 block text-sm font-medium text-fg">{t.contact.positionType}</label>
                        <div className="flex flex-wrap gap-4 text-sm text-muted">
                          <label className="flex cursor-pointer items-center gap-2">
                            <input
                              type="radio"
                              name="positionType"
                              value="permanent"
                              checked={contactForm.positionType === 'permanent'}
                              onChange={(e) => handleInputChange('positionType', e.target.value)}
                              className="accent-accent"
                            />
                            <span>{t.contact.positionPermanent}</span>
                          </label>
                        </div>
                      </div>

                      <div>
                        <label className="mb-2 block text-sm font-medium text-fg">{t.contact.requirement} <span className="text-accent">{t.contact.required}</span></label>
                        <textarea
                          required
                          value={contactForm.requirement}
                          onChange={(e) => handleInputChange('requirement', e.target.value)}
                          rows="4"
                          aria-invalid={Boolean(fieldErrors.requirement)}
                          aria-describedby={fieldErrors.requirement ? 'requirement-error' : undefined}
                          className={`w-full resize-none rounded-lg border bg-white/[0.02] px-4 py-3 text-sm text-fg placeholder-faint transition-colors focus:outline-none focus:ring-2 focus:ring-accent/25 ${fieldErrors.requirement ? 'border-red-500/60 focus:border-red-500/80' : 'border-white/12 focus:border-accent/60'}`}
                          placeholder={t.contact.requirementPlaceholder}
                        />
                        {fieldErrors.requirement && (<p id="requirement-error" className="mt-2 text-xs text-red-300" role="alert">{fieldErrors.requirement}</p>)}
                      </div>
                    </div>

                    <button
                      onClick={generateEmail}
                      className="mt-7 w-full rounded-lg bg-accent px-6 py-3 text-sm font-semibold text-ink transition-all hover:bg-accent/90 active:scale-[0.99]"
                    >
                      {t.contact.generate}
                    </button>

                    {generatedEmail && (
                      <div className="mt-6" aria-live="polite">
                        <div className="mb-3 flex items-center justify-between">
                          <label className="text-sm font-medium text-fg">{t.contact.generatedEmail}</label>
                          <button
                            onClick={copyToClipboard}
                            className="inline-flex items-center gap-2 rounded-md border border-white/15 px-3 py-1.5 text-xs font-semibold text-fg transition-colors hover:border-accent hover:text-accent"
                          >
                            {copied ? (<><Check size={15} className="text-accent" />{t.contact.copied}</>) : (<><Copy size={15} />{t.contact.copy}</>)}
                          </button>
                        </div>
                        <span className="sr-only" aria-live="polite">{copied ? (language === 'ja' ? 'メール内容をコピーしました。' : 'Email content copied.') : ''}</span>
                        <textarea
                          readOnly
                          value={generatedEmail}
                          rows="12"
                          className="w-full resize-none rounded-lg border border-white/10 bg-black/40 px-4 py-3 font-mono text-xs leading-relaxed text-muted focus:border-accent/60 focus:outline-none focus:ring-2 focus:ring-accent/20"
                        />
                        <p className="mt-2 text-xs text-faint">{t.contact.copyInstructions}</p>
                        {copyError && (<p className="mt-2 text-xs text-red-300" role="alert" aria-live="assertive">{copyError}</p>)}
                      </div>
                    )}
                  </div>
                </div>
              </section>

              </main>

              {/* Footer */}
              <footer className="border-t border-white/10 px-6 py-10">
                <div className="mx-auto flex max-w-6xl flex-col items-center justify-between gap-6 sm:flex-row">
                  <div className="text-center sm:text-left">
                    <p className="font-display text-sm font-semibold text-fg">{t.footer.name}</p>
                    <p className="mt-1 font-mono text-[0.68rem] uppercase tracking-[0.12em] text-faint">{t.footer.title}</p>
                  </div>
                  <div className="flex flex-col items-center gap-1 sm:items-end">
                    <p className="font-mono text-xs text-muted">{t.footer.location}</p>
                    <p className="font-mono text-[0.68rem] text-faint">{t.footer.rights}</p>
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        ReactDOM.render(<Portfolio />, document.getElementById('root'));
    </script>
</body>
</html>
